<!-- declares the document as HTML -->
<!DOCTYPE html>
<!-- this is the root element -->
<html>
    <!-- head tag includes meta data such as the title -->
<head>
    <title> Robson's Webpage </title>
    <meta charset="UTF-8">
    <meta name="description" content="learn HTML easily">
    <meta name="keywords" content="HTML, CSS, Javascript">
    <meta name="author" content="Robson">
</head>
<!-- body tag holds all visible content -->
<body>
    <!-- header tags h1 - h6 where h1 is largest andgets progressively smaller -->
    <h1> font size 1 </h1>
    <h2> font size 2</h2>
    <h3> font size 3</h3>
    <h4> font size 4</h4>
    <h5> font size 5</h5>
    <h6> font size 6</h6>
    <!-- p tag for description -->
    <p>this is a paragraph tag p</p>

    <div style="background-color: lightgray; padding: 10px">
        <h3>Div section</h3>
        <p>This is a block level container using "< div >".</p>
    </div>
</body>

</html>
