<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Color Changer</title>
    <!-- <script src="script.js"></script> -->
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .color-btn {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
            border: none;
        }
    </style>

</head>
<body style="background-color:gray">
    
    <h1>Click a button to change the background color</h1>

    <button class="color-btn" data-color="red">Red</button>
    <button class="color-btn" data-color="blue">Blue</button>
    <button class="color-btn" data-color="orange">Orange</button>
    <button class="color-btn" data-color="lightgreen">Lightgreen</button>
    <button class="color-btn" id="reset">Reset</button>

    <script src="script.js"></script>
    





</body>
</html>
