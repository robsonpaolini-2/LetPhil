    <style>
        .button {
            font-size: 20px;
            background-color: transparent;
            border-radius: 5px;
            border: 0px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .none {
            text-decoration: none;
        }

        .img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .mini {
            background-color: transparent;
            /* padding: 20px; */
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            object-fit: cover;
        }

        .miniframe {
            gap: 5px;
            

        }

        .miniimg {
            width: 60%;
            
        }

        .sidebar img {
            width: 80%;
            aspect-ratio: 4 / 4;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .frame img {
            width: 100%;
            aspect-ratio: 4 / 4;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        
        
    </style>
</head>
