<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <style>
        body {
            font-family: arial, sans-serif;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            padding: 20px;
        }

        .box {
            background-color: lightgreen;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }



    </style>
</head>
<body style="background-color: gray">
    
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>


    <button>
        <a href="./index.html">Page 1</a>
    </button>
    <button>
        <a href="./index2.html">Page 2</a>
    </button>
    <button>
        <a href="./index3.html">Page 3</a>
    </button>
    <button> 
        <a href="./index5"> page 5</a>
    </button>
</body>
</html>
